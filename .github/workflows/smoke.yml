name: Go tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go unit and mock integration tests
        run: go test -count=1 -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
      - name: Build production Docker image
        run: docker build -t linode-node-manager:go .
      - name: Docker Compose smoke test (mock credentials, monitoring disabled)
        shell: bash
        run: |
          mkdir -p secrets
          cat > .env <<'EOF'
          ADMIN_TOKEN=ci-admin
          LINODE_TOKEN=ci-only-mock-token
          WP2_BASE_URL=https://example.invalid
          WP2_API_TOKEN=ci-only-mock-wp2-token
          MONITOR_ENABLED=false
          EOF
          docker compose config --quiet
          docker compose up -d --build
          trap 'docker compose logs --tail=100 manager; docker compose down -v' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -H 'Authorization: Bearer ci-admin' http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              echo "Compose panel health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Compose panel health check failed"
          exit 1
