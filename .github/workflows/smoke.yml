name: Go tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go unit and mock integration tests
        run: go test -count=1 -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
      - name: Validate embedded dashboard JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('main.go').read_text()
          html = src.split('const htmlPage = `', 1)[1].split('`', 1)[0]
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/linode-dashboard.js').write_text(script)
          PY
          node --check /tmp/linode-dashboard.js
      - name: Build production Docker image
        run: docker build -t linode-node-manager:go .
      - name: Docker Compose smoke test (mock credentials, monitoring disabled)
        shell: bash
        run: |
          mkdir -p secrets
          cat > .env <<'EOF'
          ADMIN_TOKEN=ci-admin
          LINODE_TOKEN=ci-only-mock-token
          WP2_BASE_URL=https://example.invalid
          WP2_API_TOKEN=ci-only-mock-wp2-token
          MONITOR_ENABLED=false
          EOF
          docker compose config --quiet
          docker compose up -d --build
          trap 'docker compose logs --tail=100 manager; docker compose down -v' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -H 'Authorization: Bearer ci-admin' http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              echo "Compose panel health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Compose panel health check failed"
          exit 1
      - name: HTTPS public login smoke test
        shell: bash
        run: |
          cat >> .env <<'EOF'
          ADMIN_USERNAME=ci-operator
          ADMIN_PASSWORD=ci-test-password-long-enough
          PANEL_DOMAIN=localhost
          EOF
          docker compose --profile public up -d --build
          trap 'docker compose --profile public logs --tail=100 caddy manager; docker compose --profile public down -v' EXIT
          for i in $(seq 1 40); do
            status=$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/api/health || true)
            if [ "$status" = "401" ]; then break; fi
            sleep 1
          done
          test "$status" = "401"
          curl -ksS -u ci-operator:ci-test-password-long-enough https://localhost/api/health | grep -q '"status":"ok"'
          bad=$(curl -ksS -o /dev/null -w '%{http_code}' -u ci-operator:wrong-password https://localhost/api/health)
          test "$bad" = "401"
          echo "Public HTTPS and browser password authentication passed"
      - name: Compile Linux amd64 and arm64 release bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "dist/stage-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/stage-${arch}/linode-node-manager" .
            cp compose.yml Caddyfile .env.example README.md "dist/stage-${arch}/"
            tar -czf "dist/linode-node-manager-linux-${arch}.tar.gz" -C "dist/stage-${arch}" .
            rm -rf "dist/stage-${arch}"
          done
          tar -czf dist/linode-node-manager-docker-source.tar.gz --exclude=.git --exclude=.env --exclude=secrets --exclude=dist --exclude=linode-node-manager --exclude='*.pem' --exclude='*.key' -C . .
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -lh dist/*.tar.gz dist/SHA256SUMS
      - name: Upload downloadable build packages
        uses: actions/upload-artifact@v4
        with:
          name: linode-node-manager-linux-builds
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
